[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-guardrails"
version = "1.0.0"
description = "Policy, approval, budget and tamper-evident audit guardrails for LLM tool-calling agents. Standard library only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sajjad Rabby" }]
keywords = [
    "llm",
    "agents",
    "guardrails",
    "policy-engine",
    "human-in-the-loop",
    "audit-log",
    "tamper-evident",
    "tool-calling",
    "ai-safety",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/sajjad-rabby/agent-guardrails"
Repository = "https://github.com/sajjad-rabby/agent-guardrails"
Issues = "https://github.com/sajjad-rabby/agent-guardrails/issues"

[project.scripts]
guardrails = "agent_guardrails.cli:main"

[tool.setuptools]
packages = ["agent_guardrails"]

[tool.setuptools.package-data]
agent_guardrails = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"